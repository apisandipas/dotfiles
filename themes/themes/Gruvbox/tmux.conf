# Gruvbox Dark theme for tmux

# Colors
# bg: #282828, bg1: #3c3836, bg2: #504945, bg3: #665c54
# fg: #ebdbb2, fg2: #d5c4a1, gray: #928374
# red: #fb4934, green: #b8bb26, yellow: #fabd2f
# blue: #83a598, purple: #d3869b, aqua: #8ec07c, orange: #fe8019

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name
set -g status-left "#[bg=#b8bb26,fg=#282828,bold] #S #[bg=#282828,fg=#b8bb26]"

# Right: prefix indicator, directory, user@host, time
set -g status-right "#{?client_prefix,#[bg=#fb4934,fg=#282828] PREFIX #[bg=#3c3836,fg=#fb4934],#[bg=#3c3836,fg=#282828]}#[bg=#3c3836,fg=#d5c4a1] #{b:pane_current_path} #[fg=#83a598]#[bg=#83a598,fg=#282828] #(whoami)@#H #[fg=#b8bb26]#[bg=#b8bb26,fg=#282828,bold] %H:%M "

# Window status
set -g window-status-format "#[fg=#282828,bg=#3c3836]#[fg=#928374,bg=#3c3836] #I #W #[fg=#3c3836,bg=#282828]"
set -g window-status-current-format "#[fg=#282828,bg=#fabd2f]#[fg=#282828,bg=#fabd2f,bold] #I #W #[fg=#fabd2f,bg=#282828]"
set -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#b8bb26"

# Message styling
set -g message-style "bg=#3c3836,fg=#ebdbb2"
set -g message-command-style "bg=#3c3836,fg=#ebdbb2"

# Mode styling
set -g mode-style "bg=#504945,fg=#ebdbb2"
