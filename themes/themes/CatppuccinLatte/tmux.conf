# Catppuccin Latte theme for tmux

# Status bar - use the lightest color as base
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#eff1f5,fg=#4c4f69"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name - bold blue on white
set -g status-left "#[bg=#1e66f5,fg=#eff1f5,bold] #S #[bg=#eff1f5,fg=#1e66f5]"

# Right: prefix, directory, user@host, time - with good contrast
set -g status-right "#{?client_prefix,#[bg=#d20f39,fg=#eff1f5,bold] PREFIX #[bg=#eff1f5,fg=#d20f39],}#[fg=#7287fd]#[bg=#7287fd,fg=#eff1f5] #{b:pane_current_path} #[fg=#8839ef]#[bg=#8839ef,fg=#eff1f5] #(whoami)@#H #[fg=#1e66f5]#[bg=#1e66f5,fg=#eff1f5,bold] %H:%M "

# Window status - clean inactive, bold active
set -g window-status-format "#[fg=#eff1f5,bg=#9ca0b0]#[fg=#eff1f5,bg=#9ca0b0] #I #W #[fg=#9ca0b0,bg=#eff1f5]"
set -g window-status-current-format "#[fg=#eff1f5,bg=#1e66f5]#[fg=#eff1f5,bg=#1e66f5,bold] #I #W #[fg=#1e66f5,bg=#eff1f5]"
set -g window-status-separator " "

# Pane borders - subtle but visible
set -g pane-border-style "fg=#acb0be"
set -g pane-active-border-style "fg=#1e66f5"

# Message styling
set -g message-style "bg=#1e66f5,fg=#eff1f5"
set -g message-command-style "bg=#8839ef,fg=#eff1f5"

# Mode styling
set -g mode-style "bg=#7287fd,fg=#eff1f5"
