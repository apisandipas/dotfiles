# Catppuccin Mocha theme for tmux

# Colors
# base: #1e1e2e, mantle: #181825, crust: #11111b
# surface0: #313244, surface1: #45475a, surface2: #585b70
# text: #cdd6f4, subtext: #a6adc8, overlay: #6c7086
# mauve: #cba6f7, blue: #89b4fa, lavender: #b4befe
# red: #f38ba8, peach: #fab387, green: #a6e3a1, teal: #94e2d5

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#cba6f7]"

# Right: prefix indicator, directory, user@host, time
set -g status-right "#{?client_prefix,#[bg=#f38ba8,fg=#1e1e2e] PREFIX #[bg=#313244,fg=#f38ba8],#[bg=#313244,fg=#1e1e2e]}#[bg=#313244,fg=#a6adc8] #{b:pane_current_path} #[fg=#89b4fa]#[bg=#89b4fa,fg=#1e1e2e] #(whoami)@#H #[fg=#cba6f7]#[bg=#cba6f7,fg=#1e1e2e,bold] %H:%M "

# Window status
set -g window-status-format "#[fg=#1e1e2e,bg=#313244]#[fg=#6c7086,bg=#313244] #I #W #[fg=#313244,bg=#1e1e2e]"
set -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7]#[fg=#1e1e2e,bg=#cba6f7,bold] #I #W #[fg=#cba6f7,bg=#1e1e2e]"
set -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Message styling
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"

# Mode styling
set -g mode-style "bg=#45475a,fg=#cdd6f4"
