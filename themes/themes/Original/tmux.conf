# Rosé Pine Moon theme for tmux

# Colors
# bg: #232136, surface: #393552, overlay: #44415a
# text: #e0def4, subtle: #6e6a86, muted: #908caa
# rose: #ea9a97, pine: #3e8fb0, foam: #9ccfd8
# iris: #c4a7e7, love: #eb6f92, gold: #f6c177

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#232136,fg=#e0def4"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name
set -g status-left "#[bg=#3e8fb0,fg=#232136,bold] #S #[bg=#232136,fg=#3e8fb0]"

# Right: prefix indicator, directory, user@host, time
set -g status-right "#{?client_prefix,#[bg=#eb6f92,fg=#232136] PREFIX #[bg=#393552,fg=#eb6f92],#[bg=#393552,fg=#232136]}#[bg=#393552,fg=#908caa] #{b:pane_current_path} #[fg=#c4a7e7]#[bg=#c4a7e7,fg=#232136] #(whoami)@#H #[fg=#3e8fb0]#[bg=#3e8fb0,fg=#232136,bold] %H:%M "

# Window status
set -g window-status-format "#[fg=#232136,bg=#393552]#[fg=#6e6a86,bg=#393552] #I #W #[fg=#393552,bg=#232136]"
set -g window-status-current-format "#[fg=#232136,bg=#c4a7e7]#[fg=#232136,bg=#c4a7e7,bold] #I #W #[fg=#c4a7e7,bg=#232136]"
set -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#44415a"
set -g pane-active-border-style "fg=#3e8fb0"

# Message styling
set -g message-style "bg=#393552,fg=#e0def4"
set -g message-command-style "bg=#393552,fg=#e0def4"

# Mode styling
set -g mode-style "bg=#44415a,fg=#e0def4"
