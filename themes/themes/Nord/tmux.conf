# Nord theme for tmux

# Colors
# polar night: #2e3440, #3b4252, #434c5e, #4c566a
# snow storm: #d8dee9, #e5e9f0, #eceff4
# frost: #8fbcbb, #88c0d0, #81a1c1, #5e81ac
# aurora: #bf616a, #d08770, #ebcb8b, #a3be8c, #b48ead

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name
set -g status-left "#[bg=#88c0d0,fg=#2e3440,bold] #S #[bg=#2e3440,fg=#88c0d0]"

# Right: prefix indicator, directory, user@host, time
set -g status-right "#{?client_prefix,#[bg=#bf616a,fg=#2e3440] PREFIX #[bg=#3b4252,fg=#bf616a],#[bg=#3b4252,fg=#2e3440]}#[bg=#3b4252,fg=#d8dee9] #{b:pane_current_path} #[fg=#81a1c1]#[bg=#81a1c1,fg=#2e3440] #(whoami)@#H #[fg=#88c0d0]#[bg=#88c0d0,fg=#2e3440,bold] %H:%M "

# Window status
set -g window-status-format "#[fg=#2e3440,bg=#3b4252]#[fg=#4c566a,bg=#3b4252] #I #W #[fg=#3b4252,bg=#2e3440]"
set -g window-status-current-format "#[fg=#2e3440,bg=#88c0d0]#[fg=#2e3440,bg=#88c0d0,bold] #I #W #[fg=#88c0d0,bg=#2e3440]"
set -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"

# Message styling
set -g message-style "bg=#3b4252,fg=#d8dee9"
set -g message-command-style "bg=#3b4252,fg=#d8dee9"

# Mode styling
set -g mode-style "bg=#434c5e,fg=#d8dee9"
