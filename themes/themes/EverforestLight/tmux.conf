# Everforest Light theme for tmux

# Colors
# bg0: #fdf6e3, bg1: #f4f0d9, bg3: #e6e2cc, bg4: #e0dcc7
# fg: #5c6a72, red: #f85552, orange: #f57d26
# yellow: #dfa000, green: #8da101, aqua: #35a77c
# blue: #3a94c5, purple: #df69ba, grey1: #939f91

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#fdf6e3,fg=#5c6a72"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name
set -g status-left "#[bg=#8da101,fg=#fdf6e3,bold] #S #[bg=#fdf6e3,fg=#8da101]"

# Right: prefix indicator, directory, user@host, time
set -g status-right "#{?client_prefix,#[bg=#f85552,fg=#fdf6e3] PREFIX #[bg=#f4f0d9,fg=#f85552],#[bg=#f4f0d9,fg=#fdf6e3]}#[bg=#f4f0d9,fg=#5c6a72] #{b:pane_current_path} #[fg=#3a94c5]#[bg=#3a94c5,fg=#fdf6e3] #(whoami)@#H #[fg=#8da101]#[bg=#8da101,fg=#fdf6e3,bold] %H:%M "

# Window status
set -g window-status-format "#[fg=#fdf6e3,bg=#f4f0d9]#[fg=#939f91,bg=#f4f0d9] #I #W #[fg=#f4f0d9,bg=#fdf6e3]"
set -g window-status-current-format "#[fg=#fdf6e3,bg=#8da101]#[fg=#fdf6e3,bg=#8da101,bold] #I #W #[fg=#8da101,bg=#fdf6e3]"
set -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#e6e2cc"
set -g pane-active-border-style "fg=#8da101"

# Message styling
set -g message-style "bg=#f4f0d9,fg=#5c6a72"
set -g message-command-style "bg=#f4f0d9,fg=#5c6a72"

# Mode styling
set -g mode-style "bg=#eaedc8,fg=#5c6a72"
