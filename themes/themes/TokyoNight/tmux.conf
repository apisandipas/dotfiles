# Tokyo Night (Storm) theme for tmux

# Colors
# bg: #24283b, bg_dark: #1f2335, fg: #c0caf5
# blue: #7aa2f7, cyan: #7dcfff, green: #9ece6a
# magenta: #bb9af7, red: #f7768e, yellow: #e0af68

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#24283b,fg=#c0caf5"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name
set -g status-left "#[bg=#7aa2f7,fg=#24283b,bold] #S #[bg=#24283b,fg=#7aa2f7]"

# Right: prefix indicator, directory, user@host, time
set -g status-right "#{?client_prefix,#[bg=#f7768e,fg=#24283b] PREFIX #[bg=#1f2335,fg=#f7768e],#[bg=#1f2335,fg=#24283b]}#[bg=#1f2335,fg=#c0caf5] #{b:pane_current_path} #[fg=#bb9af7]#[bg=#bb9af7,fg=#24283b] #(whoami)@#H #[fg=#7aa2f7]#[bg=#7aa2f7,fg=#24283b,bold] %H:%M "

# Window status
set -g window-status-format "#[fg=#24283b,bg=#1f2335]#[fg=#565f89,bg=#1f2335] #I #W #[fg=#1f2335,bg=#24283b]"
set -g window-status-current-format "#[fg=#24283b,bg=#7aa2f7]#[fg=#24283b,bg=#7aa2f7,bold] #I #W #[fg=#7aa2f7,bg=#24283b]"
set -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Message styling
set -g message-style "bg=#1f2335,fg=#c0caf5"
set -g message-command-style "bg=#1f2335,fg=#c0caf5"

# Mode styling
set -g mode-style "bg=#2e3c64,fg=#c0caf5"
