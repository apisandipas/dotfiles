# Nord Light theme for tmux

# Colors
# snow storm: #d8dee9, #e5e9f0, #eceff4
# polar night: #2e3440, #3b4252, #434c5e, #4c566a
# frost: #8fbcbb, #88c0d0, #81a1c1, #5e81ac
# aurora: #bf616a, #d08770, #ebcb8b, #a3be8c, #b48ead

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#eceff4,fg=#2e3440"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name
set -g status-left "#[bg=#5e81ac,fg=#eceff4,bold] #S #[bg=#eceff4,fg=#5e81ac]"

# Right: prefix indicator, directory, user@host, time
set -g status-right "#{?client_prefix,#[bg=#bf616a,fg=#eceff4] PREFIX #[bg=#e5e9f0,fg=#bf616a],#[bg=#e5e9f0,fg=#eceff4]}#[bg=#e5e9f0,fg=#4c566a] #{b:pane_current_path} #[fg=#81a1c1]#[bg=#81a1c1,fg=#eceff4] #(whoami)@#H #[fg=#5e81ac]#[bg=#5e81ac,fg=#eceff4,bold] %H:%M "

# Window status
set -g window-status-format "#[fg=#eceff4,bg=#e5e9f0]#[fg=#4c566a,bg=#e5e9f0] #I #W #[fg=#e5e9f0,bg=#eceff4]"
set -g window-status-current-format "#[fg=#eceff4,bg=#5e81ac]#[fg=#eceff4,bg=#5e81ac,bold] #I #W #[fg=#5e81ac,bg=#eceff4]"
set -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#d8dee9"
set -g pane-active-border-style "fg=#5e81ac"

# Message styling
set -g message-style "bg=#e5e9f0,fg=#2e3440"
set -g message-command-style "bg=#e5e9f0,fg=#2e3440"

# Mode styling
set -g mode-style "bg=#d8dee9,fg=#2e3440"
