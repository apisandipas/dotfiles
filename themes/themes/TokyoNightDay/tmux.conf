# Tokyo Night Day theme for tmux

# Colors
# bg: #e1e2e7, bg_dark: #d0d5e3, fg: #3760bf
# blue: #2e7de9, cyan: #007197, green: #587539
# magenta: #9854f1, red: #f52a65, yellow: #8c6c3e

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#e1e2e7,fg=#3760bf"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name
set -g status-left "#[bg=#2e7de9,fg=#e1e2e7,bold] #S #[bg=#e1e2e7,fg=#2e7de9]"

# Right: prefix indicator, directory, user@host, time
set -g status-right "#{?client_prefix,#[bg=#f52a65,fg=#e1e2e7] PREFIX #[bg=#d0d5e3,fg=#f52a65],#[bg=#d0d5e3,fg=#e1e2e7]}#[bg=#d0d5e3,fg=#3760bf] #{b:pane_current_path} #[fg=#9854f1]#[bg=#9854f1,fg=#e1e2e7] #(whoami)@#H #[fg=#2e7de9]#[bg=#2e7de9,fg=#e1e2e7,bold] %H:%M "

# Window status
set -g window-status-format "#[fg=#e1e2e7,bg=#d0d5e3]#[fg=#848cb5,bg=#d0d5e3] #I #W #[fg=#d0d5e3,bg=#e1e2e7]"
set -g window-status-current-format "#[fg=#e1e2e7,bg=#2e7de9]#[fg=#e1e2e7,bg=#2e7de9,bold] #I #W #[fg=#2e7de9,bg=#e1e2e7]"
set -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#c4c8da"
set -g pane-active-border-style "fg=#2e7de9"

# Message styling
set -g message-style "bg=#d0d5e3,fg=#3760bf"
set -g message-command-style "bg=#d0d5e3,fg=#3760bf"

# Mode styling
set -g mode-style "bg=#b7c1e3,fg=#3760bf"
