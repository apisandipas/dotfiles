# Everforest Dark theme for tmux

# Colors
# bg0: #2d353b, bg1: #343f44, bg2: #3d484d, bg3: #475258
# fg: #d3c6aa, red: #e67e80, orange: #e69875
# yellow: #dbbc7f, green: #a7c080, aqua: #83c092
# blue: #7fbbb3, purple: #d699b6, grey1: #859289

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#2d353b,fg=#d3c6aa"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name
set -g status-left "#[bg=#a7c080,fg=#2d353b,bold] #S #[bg=#2d353b,fg=#a7c080]"

# Right: prefix indicator, directory, user@host, time
set -g status-right "#{?client_prefix,#[bg=#e67e80,fg=#2d353b] PREFIX #[bg=#343f44,fg=#e67e80],#[bg=#343f44,fg=#2d353b]}#[bg=#343f44,fg=#d3c6aa] #{b:pane_current_path} #[fg=#7fbbb3]#[bg=#7fbbb3,fg=#2d353b] #(whoami)@#H #[fg=#a7c080]#[bg=#a7c080,fg=#2d353b,bold] %H:%M "

# Window status
set -g window-status-format "#[fg=#2d353b,bg=#343f44]#[fg=#859289,bg=#343f44] #I #W #[fg=#343f44,bg=#2d353b]"
set -g window-status-current-format "#[fg=#2d353b,bg=#a7c080]#[fg=#2d353b,bg=#a7c080,bold] #I #W #[fg=#a7c080,bg=#2d353b]"
set -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#475258"
set -g pane-active-border-style "fg=#a7c080"

# Message styling
set -g message-style "bg=#343f44,fg=#d3c6aa"
set -g message-command-style "bg=#343f44,fg=#d3c6aa"

# Mode styling
set -g mode-style "bg=#543a48,fg=#d3c6aa"
