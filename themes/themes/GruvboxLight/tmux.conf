# Gruvbox Light theme for tmux

# Colors
# bg: #fbf1c7, bg1: #ebdbb2, bg2: #d5c4a1, bg3: #bdae93
# fg: #3c3836, fg2: #504945, gray: #928374
# red: #9d0006, green: #79740e, yellow: #b57614
# blue: #076678, purple: #8f3f71, aqua: #427b58, orange: #af3a03

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#fbf1c7,fg=#3c3836"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name
set -g status-left "#[bg=#79740e,fg=#fbf1c7,bold] #S #[bg=#fbf1c7,fg=#79740e]"

# Right: prefix indicator, directory, user@host, time
set -g status-right "#{?client_prefix,#[bg=#9d0006,fg=#fbf1c7] PREFIX #[bg=#ebdbb2,fg=#9d0006],#[bg=#ebdbb2,fg=#fbf1c7]}#[bg=#ebdbb2,fg=#504945] #{b:pane_current_path} #[fg=#076678]#[bg=#076678,fg=#fbf1c7] #(whoami)@#H #[fg=#79740e]#[bg=#79740e,fg=#fbf1c7,bold] %H:%M "

# Window status
set -g window-status-format "#[fg=#fbf1c7,bg=#ebdbb2]#[fg=#928374,bg=#ebdbb2] #I #W #[fg=#ebdbb2,bg=#fbf1c7]"
set -g window-status-current-format "#[fg=#fbf1c7,bg=#b57614]#[fg=#fbf1c7,bg=#b57614,bold] #I #W #[fg=#b57614,bg=#fbf1c7]"
set -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#ebdbb2"
set -g pane-active-border-style "fg=#79740e"

# Message styling
set -g message-style "bg=#ebdbb2,fg=#3c3836"
set -g message-command-style "bg=#ebdbb2,fg=#3c3836"

# Mode styling
set -g mode-style "bg=#d5c4a1,fg=#3c3836"
