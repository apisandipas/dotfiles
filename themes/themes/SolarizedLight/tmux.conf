# Solarized Light theme for tmux

# Colors
# base3: #fdf6e3, base2: #eee8d5, base1: #93a1a1, base0: #839496
# base00: #657b83, base01: #586e75, base02: #073642, base03: #002b36
# yellow: #b58900, orange: #cb4b16, red: #dc322f, magenta: #d33682
# violet: #6c71c4, blue: #268bd2, cyan: #2aa198, green: #859900

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#fdf6e3,fg=#657b83"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name
set -g status-left "#[bg=#268bd2,fg=#fdf6e3,bold] #S #[bg=#fdf6e3,fg=#268bd2]"

# Right: prefix indicator, directory, user@host, time
set -g status-right "#{?client_prefix,#[bg=#dc322f,fg=#fdf6e3] PREFIX #[bg=#eee8d5,fg=#dc322f],#[bg=#eee8d5,fg=#fdf6e3]}#[bg=#eee8d5,fg=#586e75] #{b:pane_current_path} #[fg=#2aa198]#[bg=#2aa198,fg=#fdf6e3] #(whoami)@#H #[fg=#268bd2]#[bg=#268bd2,fg=#fdf6e3,bold] %H:%M "

# Window status
set -g window-status-format "#[fg=#fdf6e3,bg=#eee8d5]#[fg=#93a1a1,bg=#eee8d5] #I #W #[fg=#eee8d5,bg=#fdf6e3]"
set -g window-status-current-format "#[fg=#fdf6e3,bg=#b58900]#[fg=#fdf6e3,bg=#b58900,bold] #I #W #[fg=#b58900,bg=#fdf6e3]"
set -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#eee8d5"
set -g pane-active-border-style "fg=#268bd2"

# Message styling
set -g message-style "bg=#eee8d5,fg=#657b83"
set -g message-command-style "bg=#eee8d5,fg=#657b83"

# Mode styling
set -g mode-style "bg=#eee8d5,fg=#657b83"
