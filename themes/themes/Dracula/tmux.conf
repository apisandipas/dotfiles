# Dracula theme for tmux

# Colors
# bg: #282a36, current_line: #44475a, fg: #f8f8f2
# comment: #6272a4, cyan: #8be9fd, green: #50fa7b
# orange: #ffb86c, pink: #ff79c6, purple: #bd93f9
# red: #ff5555, yellow: #f1fa8c

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name
set -g status-left "#[bg=#bd93f9,fg=#282a36,bold] #S #[bg=#282a36,fg=#bd93f9]"

# Right: prefix indicator, directory, user@host, time
set -g status-right "#{?client_prefix,#[bg=#ff5555,fg=#282a36] PREFIX #[bg=#44475a,fg=#ff5555],#[bg=#44475a,fg=#282a36]}#[bg=#44475a,fg=#f8f8f2] #{b:pane_current_path} #[fg=#ff79c6]#[bg=#ff79c6,fg=#282a36] #(whoami)@#H #[fg=#bd93f9]#[bg=#bd93f9,fg=#282a36,bold] %H:%M "

# Window status
set -g window-status-format "#[fg=#282a36,bg=#44475a]#[fg=#6272a4,bg=#44475a] #I #W #[fg=#44475a,bg=#282a36]"
set -g window-status-current-format "#[fg=#282a36,bg=#bd93f9]#[fg=#282a36,bg=#bd93f9,bold] #I #W #[fg=#bd93f9,bg=#282a36]"
set -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"

# Message styling
set -g message-style "bg=#44475a,fg=#f8f8f2"
set -g message-command-style "bg=#44475a,fg=#f8f8f2"

# Mode styling
set -g mode-style "bg=#44475a,fg=#f8f8f2"
