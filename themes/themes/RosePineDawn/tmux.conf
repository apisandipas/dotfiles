# Rosé Pine Dawn theme for tmux

# Status bar - use the lightest color as base
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#faf4ed,fg=#575279"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name - bold pine on base
set -g status-left "#[bg=#286983,fg=#faf4ed,bold] #S #[bg=#faf4ed,fg=#286983]"

# Right: prefix, directory, user@host, time - with good contrast
set -g status-right "#{?client_prefix,#[bg=#b4637a,fg=#faf4ed,bold] PREFIX #[bg=#faf4ed,fg=#b4637a],}#[fg=#907aa9]#[bg=#907aa9,fg=#faf4ed] #{b:pane_current_path} #[fg=#56949f]#[bg=#56949f,fg=#faf4ed] #(whoami)@#H #[fg=#286983]#[bg=#286983,fg=#faf4ed,bold] %H:%M "

# Window status - clean inactive, bold active
set -g window-status-format "#[fg=#faf4ed,bg=#dfdad9]#[fg=#9893a5,bg=#dfdad9] #I #W #[fg=#dfdad9,bg=#faf4ed]"
set -g window-status-current-format "#[fg=#faf4ed,bg=#286983]#[fg=#faf4ed,bg=#286983,bold] #I #W #[fg=#286983,bg=#faf4ed]"
set -g window-status-separator " "

# Pane borders - subtle but visible
set -g pane-border-style "fg=#dfdad9"
set -g pane-active-border-style "fg=#286983"

# Message styling
set -g message-style "bg=#286983,fg=#faf4ed"
set -g message-command-style "bg=#907aa9,fg=#faf4ed"

# Mode styling
set -g mode-style "bg=#dfdad9,fg=#575279"
