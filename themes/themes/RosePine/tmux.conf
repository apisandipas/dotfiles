# Rosé Pine theme for tmux

# Colors
# bg: #191724, surface: #1f1d2e, overlay: #26233a
# text: #e0def4, subtle: #908caa, muted: #6e6a86
# rose: #ebbcba, pine: #31748f, foam: #9ccfd8
# iris: #c4a7e7, love: #eb6f92, gold: #f6c177

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#191724,fg=#e0def4"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name
set -g status-left "#[bg=#31748f,fg=#191724,bold] #S #[bg=#191724,fg=#31748f]"

# Right: prefix indicator, directory, user@host, time
set -g status-right "#{?client_prefix,#[bg=#eb6f92,fg=#191724] PREFIX #[bg=#1f1d2e,fg=#eb6f92],#[bg=#1f1d2e,fg=#191724]}#[bg=#1f1d2e,fg=#908caa] #{b:pane_current_path} #[fg=#c4a7e7]#[bg=#c4a7e7,fg=#191724] #(whoami)@#H #[fg=#31748f]#[bg=#31748f,fg=#191724,bold] %H:%M "

# Window status
set -g window-status-format "#[fg=#191724,bg=#1f1d2e]#[fg=#6e6a86,bg=#1f1d2e] #I #W #[fg=#1f1d2e,bg=#191724]"
set -g window-status-current-format "#[fg=#191724,bg=#c4a7e7]#[fg=#191724,bg=#c4a7e7,bold] #I #W #[fg=#c4a7e7,bg=#191724]"
set -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#31748f"

# Message styling
set -g message-style "bg=#1f1d2e,fg=#e0def4"
set -g message-command-style "bg=#1f1d2e,fg=#e0def4"

# Mode styling
set -g mode-style "bg=#26233a,fg=#e0def4"
